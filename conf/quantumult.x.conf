# 服务器测试链接
;server_check_url=http://captive.apple.com/generate_204
;server_check_url=http://cp.cloudflare.com/generate_204
;server_check_url=http://www.qualcomm.cn/generate_204
server_check_url=http://www.gstatic.com/generate_204
# 服务器测试超时时间 (毫秒，小于 5000 毫秒才生效)
server_check_timeout=3000
# 图标显示设置
profile_img_url=https://raw.githubusercontent.com/Vikingama/plugins/beta/logo/others/koolson.qure.aaex.png
# 节点信息展示
;geo_location_checker=https://ip-api.com/json/?lang=zh-CN,https://raw.githubusercontent.com/Vikingama/plugins/beta/script/kop.xiao.ip.api.js
geo_location_checker=https://ifconfig.co/json,https://raw.githubusercontent.com/Vikingama/plugins/beta/script/kop.xiao.ip.api.js
# 引用资源转换
resource_parser_url=https://raw.githubusercontent.com/Vikingama/plugins/beta/script/kop.xiao.resource.parser.js
# 下列路径将不处理
excluded_routes=239.255.255.250/32,24.105.30.129/32,185.60.112.157/32,185.60.112.158/32,182.162.132.1/32
# 第一个，使用蜂窝网络时，开启规则分流
# 第二个，其他 wifi* 下，开启规则分流
# 第三个，连接 wifi1 时，开启直连模式
# 第四个，连接 wifi2 时，开启全局代理
running_mode_trigger=filter,filter,wifi1:all_direct,wifi2:all_proxy
